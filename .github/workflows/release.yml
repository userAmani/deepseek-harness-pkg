name: Build and Release DeepSeek Harness

on:
  workflow_dispatch:
    inputs:
      dsh_version:
        description: '要打包的 dsh 版本 (例如: 0.1.0-rc.6 或 latest)'
        required: true
        default: '0.1.0-rc.6'
  workflow_call:
    inputs:
      dsh_version:
        description: '要打包的 dsh 版本 (例如: 0.1.0-rc.6 或 latest)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-latest]
        include:
          - os: windows-latest
            artifact_name: deepseek-harness-pkg-windows.zip
          - os: macos-latest
            artifact_name: deepseek-harness-pkg-macos-arm64.zip
          - os: macos-15-intel
            artifact_name: deepseek-harness-pkg-macos-x64.zip
          - os: ubuntu-latest
            artifact_name: deepseek-harness-pkg-linux.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 必须与 desktop 捆绑运行时保持一致（src-tauri/src/config/constants.rs 的 NODE_VERSION）。
          # 原生依赖（如 fs-ext）会在构建期编译，ABI 只匹配同一大版本的运行时。
          node-version: 22.22.0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Pin dsh version and install dependencies
        shell: bash
        run: |
          pnpm add "@deepseek-ai/dsh@${{ inputs.dsh_version || github.event.inputs.dsh_version }}" --save-exact
          pnpm install

      - name: Deploy package
        shell: bash
        run: |
          pnpm deploy --filter . --prod build_dir --legacy
          cd build_dir
          npm install --omit=dev

      - name: Apply dsh-web-app patch
        shell: bash
        working-directory: build_dir
        run: |
          node ../scripts/apply-dsh-web-app-patch.mjs

      - name: Verify patch applied
        shell: bash
        working-directory: build_dir
        run: |
          grep -q 'DSH_PKG_ALLOW_LAN' node_modules/@deepseek-ai/dsh-web-app/lib/startup.js && echo "patch OK" || (echo "patch missing" && exit 1)

      - name: Cleanup unnecessary files
        shell: bash
        working-directory: build_dir
        run: |
          # 统一瘦身逻辑 (跨平台支持)
          find node_modules -type f \( -name "*.map" -o -name "*.ts" -o -name "*.mts" \) -delete || true
          find node_modules -type d \( -name "test" -o -name "tests" -o -name "benchmark" -o -name "example" -o -name "demo" \) -exec rm -rf {} + || true

      - name: Create archive
        shell: bash
        working-directory: build_dir
        run: |
          # 根据不同平台使用对应的压缩命令
          # 注意：patches 目录已随 799ce3ba 移除（dsh-web-app 补丁改为
          # scripts/apply-dsh-web-app-patch.mjs 直接打进 node_modules），
          # 不能再列入打包清单——7z 对缺失路径返回非零退出码会导致 Windows
          # 打包失败（zip 仅告警，这也是此前只有 Windows 失败的原因）。
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a ../${{ matrix.artifact_name }} node_modules package.json package-lock.json
          else
            zip -r ../${{ matrix.artifact_name }} node_modules package.json package-lock.json
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dsh-${{ inputs.dsh_version || github.event.inputs.dsh_version }}-${{ github.run_id }}
          name: Release-dsh-${{ inputs.dsh_version || github.event.inputs.dsh_version }}
          body: |
            # DeepSeek Harness Desktop Packages
            - Version: ${{ inputs.dsh_version || github.event.inputs.dsh_version }}
            - Build ID: ${{ github.run_id }}
            - 使用说明见仓库 README.md
          draft: false
          prerelease: false
          # 自动匹配下载目录下的 zip 文件
          files: |
            ./artifacts/**/*.zip
